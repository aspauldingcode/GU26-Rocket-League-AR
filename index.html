<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket League AR</title>
  <link rel="preload" href="qrcode.min.js" as="script">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <style type="text/css">
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      color: #111;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      background: #111;
    }

    /* Portrait photo on landscape: blurred cover fill + sharp contained subject. */
    #wallpaper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #111;
    }
    #wallpaper-blur,
    #wallpaper-sharp {
      position: absolute;
      inset: 0;
      background-image: url("liamgoggles.webp");
      background-position: center center;
      background-repeat: no-repeat;
    }
    #wallpaper-blur {
      background-size: cover;
      background-position: center 42%;
      transform: scale(1.12);
      filter: blur(28px) saturate(1.15) brightness(0.72);
      -webkit-filter: blur(28px) saturate(1.15) brightness(0.72);
    }
    #wallpaper-sharp {
      /* Keep the tee logo near mid-frame; UI sits below it. */
      background-size: contain;
      background-position: center 38%;
      filter: none;
      -webkit-filter: none;
    }

    table.page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
    }
    td.center {
      text-align: center;
      /* QR panel low so the centered shirt logo stays clear. */
      vertical-align: bottom;
      padding: 16px 16px 6vh;
    }
    .box {
      display: inline-block;
      background: rgba(244, 244, 244, 0.92);
      border: 2px solid #000;
      padding: 12px 16px 14px;
      max-width: 92vw;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: bold;
    }
    #status {
      margin: 0 0 10px;
      color: #333;
    }
    #pair {
      margin: 0 auto;
    }
    #qr {
      display: block;
      margin: 0 auto;
      width: 240px;
      min-height: 240px;
      background: #fff;
      border: 1px solid #000;
      overflow: hidden;
      line-height: 0;
    }
    #qr table {
      border-collapse: collapse;
      margin: 0 auto !important;
    }
    #qr img, #qr canvas, #qr svg {
      display: block;
      width: 240px;
      height: 240px;
      margin: 0 auto;
    }
    #room {
      margin-top: 8px;
      font-weight: bold;
    }
    #stage {
      margin: 10px auto 0;
      width: 420px;
      max-width: 90vw;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #000;
      overflow: hidden;
    }
    #view {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    /* Presentation: once the phone is casting, fill with the 16:9 mono AR frame. */
    body.live #wallpaper { opacity: 0.25; }
    body.live .box {
      background: rgba(0, 0, 0, 0.72);
      color: #eee;
      border-color: #444;
      max-width: min(96vw, 1280px);
      width: min(96vw, 1280px);
    }
    body.live h1, body.live #status { color: #ddd; }
    body.live #pair { display: none !important; }
    body.live #stage {
      width: 100%;
      max-width: none;
      margin: 8px 0 0;
      border-width: 1px;
      aspect-ratio: 16 / 9;
      max-height: 78vh;
    }
    body.live #view {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #actions {
      margin-top: 10px;
    }
    input[type="button"] {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      background: #ddd;
      border: 2px outset #ccc;
      padding: 3px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wallpaper" aria-hidden="true">
    <div id="wallpaper-blur"></div>
    <div id="wallpaper-sharp"></div>
  </div>

  <table class="page" cellpadding="0" cellspacing="0">
    <tr>
      <td class="center">
        <div class="box">
          <h1>Rocket League AR</h1>
          <a href="webrtc_viewer.html"><h1>alternative</h1></a>
          <div id="status">loading...</div>

          <div id="pair">
            <div id="qr" role="img" aria-label="Pairing QR"></div>
            <div id="room">----</div>
          </div>

          <div id="stage" style="display:none">
            <video id="view" autoplay playsinline muted></video>
          </div>

          <div id="actions" style="display:none">
            <input type="button" id="reconnect" value="Reconnect">
            <input type="button" id="leave" value="New QR">
          </div>
        </div>
      </td>
    </tr>
  </table>
  <script src="qrcode.min.js?v=cast3d2"></script>
  <script>
    if (typeof qrcode === "function") window.qrcode = qrcode;
  </script>
  <script src="webrtc.js?v=cast16x9"></script>
</body>
</html>
