<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket League AR</title>
  <link rel="preload" href="qrcode.min.js" as="script">
  <link rel="preload" href="mqtt.min.js?v=5.14.1" as="script">
  <style type="text/css">
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      color: #111;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      background: #111;
    }

    /* Pairing: QR and photo share the window; live stream hides both. */
    #pair-layout {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 100%;
      box-sizing: border-box;
    }

    #panel {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 16px;
      z-index: 2;
    }

    #wallpaper {
      position: relative;
      overflow: hidden;
      background: #111;
      pointer-events: none;
      min-width: 0;
      min-height: 0;
    }
    #wallpaper-blur,
    #wallpaper-sharp {
      position: absolute;
      inset: 0;
      background-image: url("liamgoggles.webp");
      background-position: center center;
      background-repeat: no-repeat;
    }
    #wallpaper-blur {
      background-size: cover;
      background-position: center 42%;
      transform: scale(1.12);
      filter: blur(28px) saturate(1.15) brightness(0.72);
      -webkit-filter: blur(28px) saturate(1.15) brightness(0.72);
    }
    #wallpaper-sharp {
      background-size: contain;
      background-position: center center;
      filter: none;
      -webkit-filter: none;
    }

    .box {
      display: inline-block;
      background: rgba(244, 244, 244, 0.92);
      border: 2px solid #000;
      padding: 12px 16px 14px;
      max-width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: bold;
    }
    #status {
      margin: 0 0 10px;
      color: #333;
    }
    #pair {
      margin: 0 auto;
    }
    #qr {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      width: 300px;
      height: 300px;
      background: #fff;
      border: 1px solid #000;
      overflow: hidden;
      line-height: 0;
    }
    #qr table {
      border-collapse: collapse;
      margin: 0 auto !important;
    }
    #qr img, #qr canvas, #qr svg {
      display: block;
      width: 300px;
      height: 300px;
      margin: 0 auto;
    }
    #room {
      margin-top: 8px;
      font-weight: bold;
    }
    #actions {
      margin-top: 10px;
    }
    input[type="button"] {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      background: #ddd;
      border: 2px outset #ccc;
      padding: 3px 10px;
      cursor: pointer;
    }

    /* Landscape: QR left, photo right — nothing drawn over the image. */
    @media (orientation: landscape) {
      #pair-layout {
        flex-direction: row;
        align-items: stretch;
      }
      #panel {
        flex: 0 0 auto;
        width: min(420px, 42vw);
        background: rgba(17, 17, 17, 0.55);
      }
      #wallpaper {
        flex: 1 1 auto;
      }
    }

    /* Portrait: QR above the vertical center; photo fills the rest below. */
    @media (orientation: portrait) {
      #pair-layout {
        flex-direction: column;
        align-items: stretch;
      }
      #panel {
        flex: 0 0 auto;
        width: 100%;
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: 12px;
        /* Sit in the upper half so the QR is above center. */
        justify-content: flex-end;
        min-height: 42vh;
        background: linear-gradient(to bottom, rgba(17, 17, 17, 0.72), rgba(17, 17, 17, 0.35));
      }
      #wallpaper {
        flex: 1 1 auto;
        min-height: 40vh;
      }
      #qr {
        width: min(280px, 72vw);
        height: min(280px, 72vw);
      }
      #qr img, #qr canvas, #qr svg {
        width: min(280px, 72vw);
        height: min(280px, 72vw);
      }
    }

    /* External display: once the phone streams, its mono view fills the window. */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #000;
      cursor: zoom-in;
    }
    #view {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    body.live #pair-layout { display: none; }
    #live-status {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 6;
      color: #bbb;
      font-size: 12px;
      display: none;
      text-shadow: 0 0 3px #000;
    }
    body.live #live-status { display: block; }
  </style>
</head>
<body>
  <div id="pair-layout">
    <div id="panel">
      <div class="box">
        <h1>Rocket League AR</h1>
        <div id="status">Scan QR</div>

        <div id="pair">
          <div id="qr" role="img" aria-label="Pairing QR"></div>
          <div id="room">----</div>
        </div>

        <div id="actions" style="display:none">
          <input type="button" id="reconnect" value="Reconnect">
          <input type="button" id="leave" value="New QR">
        </div>
      </div>
    </div>

    <div id="wallpaper" aria-hidden="true">
      <div id="wallpaper-blur"></div>
      <div id="wallpaper-sharp"></div>
    </div>
  </div>

  <div id="stage" style="display:none">
    <canvas id="view" width="960" height="540"></canvas>
  </div>
  <div id="live-status"></div>
  <script src="qrcode.min.js?v=cast3d2"></script>
  <script>
    if (typeof qrcode === "function") window.qrcode = qrcode;
  </script>
  <script src="mqtt.min.js?v=5.14.1"></script>
  <script src="webrtc.js?v=relay2"></script>
</body>
</html>
