<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket League AR</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      color: #111;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      background: #222 url("arch-linux-tshirt.jpg") center center / cover no-repeat fixed;
    }
    table.page {
      width: 100%;
      height: 100vh;
      border: 0;
    }
    td.center {
      text-align: center;
      vertical-align: middle;
    }
    .box {
      display: inline-block;
      background: #f4f4f4;
      border: 2px solid #000;
      padding: 12px 16px 14px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: bold;
    }
    #status {
      margin: 0 0 10px;
      color: #333;
    }
    #qr {
      display: block;
      margin: 0 auto;
      width: 240px;
      height: 240px;
      background: #fff;
      border: 1px solid #000;
    }
    #room {
      margin-top: 8px;
      font-weight: bold;
    }
    #stage {
      margin: 10px auto 0;
      width: 420px;
      max-width: 90vw;
      background: #000;
      border: 2px solid #000;
    }
    #view {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }
    #actions {
      margin-top: 10px;
    }
    input[type="button"] {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      background: #ddd;
      border: 2px outset #ccc;
      padding: 3px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <table class="page" cellpadding="0" cellspacing="0">
    <tr>
      <td class="center">
        <div class="box">
          <h1>Rocket League AR</h1>
          <div id="status">loading...</div>

          <div id="pair">
            <img id="qr" alt="QR" width="240" height="240">
            <div id="room">----</div>
          </div>

          <div id="stage" style="display:none">
            <video id="view" autoplay playsinline muted></video>
          </div>

          <div id="actions" style="display:none">
            <input type="button" id="reconnect" value="Reconnect">
            <input type="button" id="leave" value="New QR">
          </div>
        </div>
      </td>
    </tr>
  </table>
  <script src="webrtc.js"></script>
</body>
</html>
